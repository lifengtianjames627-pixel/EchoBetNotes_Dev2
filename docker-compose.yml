services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: echobetnotes
      POSTGRES_PASSWORD: echobetnotes
      POSTGRES_DB: echobetnotes
    volumes:
      - echobetnotes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echobetnotes -d echobetnotes"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  echobetnotes_pgdata:
